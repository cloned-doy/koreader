name: Build Android APK
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt install --no-install-recommends autoconf automake build-essential \
            ca-certificates cmake gcc-multilib gettext git libtool libtool-bin meson \
            nasm ninja-build patch pkg-config unzip wget p7zip-full

      - name: Build
        run: |
          ./kodev fetch-thirdparty
          ./kodev build android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: koreader-android-arm64
          path: '**/*.apk'
